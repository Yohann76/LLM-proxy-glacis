<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProxyLLM Glacis — Test API</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0f1115;
      color: #e6e6e6;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #262a33;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    header h1 { margin: 0; font-size: 1.15rem; }
    header a { color: #7aa2f7; font-size: .85rem; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    .settings { margin-left: auto; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
    .settings input {
      background: #171a21;
      border: 1px solid #262a33;
      border-radius: 6px;
      color: #e6e6e6;
      padding: .4rem .6rem;
      font-size: .78rem;
    }
    #provider { width: 110px; }
    #model { width: 150px; }
    #apiKey { width: 150px; }
    #virtualKey { width: 150px; }
    button {
      background: #3b6fe0;
      color: white;
      border: none;
      border-radius: 6px;
      padding: .45rem 1rem;
      font-size: .8rem;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    button:hover:not(:disabled) { background: #4c7cf0; }
    button.secondary { background: #262a33; }
    button.secondary:hover:not(:disabled) { background: #333947; }

    #warning {
      padding: .5rem 1.5rem;
      font-size: .72rem;
      color: #ff9d7a;
      border-bottom: 1px solid #262a33;
      flex-shrink: 0;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      min-height: 0;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    #chat .empty { margin: auto; color: #9aa2af; font-size: .85rem; text-align: center; }

    .bubble-row { display: flex; }
    .bubble-row.user { justify-content: flex-end; }
    .bubble-row.assistant { justify-content: flex-start; }
    .bubble {
      max-width: 75%;
      padding: .65rem .9rem;
      border-radius: 12px;
      font-size: .88rem;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble-row.user .bubble { background: #3b6fe0; color: white; border-bottom-right-radius: 3px; }
    .bubble-row.assistant .bubble { background: #171a21; border: 1px solid #262a33; border-bottom-left-radius: 3px; }
    .bubble-row.assistant .bubble.error { border-color: #7a2f2f; color: #ff9d9d; }
    .bubble-row.assistant .bubble.loading { color: #9aa2af; }

    .meta-line {
      margin-top: .35rem;
      display: flex;
      gap: .5rem;
      font-size: .7rem;
      color: #9aa2af;
      flex-wrap: wrap;
    }
    .meta-line .pill { padding: .1rem .45rem; border-radius: 999px; background: #1c1f27; }
    .meta-line .pill.ok { color: #7ee787; }
    .meta-line .pill.ko { color: #ff7b72; }
    .meta-line a { color: #7aa2f7; cursor: pointer; text-decoration: none; }
    .meta-line a:hover { text-decoration: underline; }
    .raw {
      margin-top: .4rem;
      background: #0c0e12;
      border: 1px solid #262a33;
      border-radius: 6px;
      padding: .6rem .7rem;
      font-family: ui-monospace, monospace;
      font-size: .72rem;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
    }

    #composer {
      flex-shrink: 0;
      display: flex;
      gap: .6rem;
      padding: 1rem 1.5rem 1.5rem;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      resize: none;
      background: #171a21;
      border: 1px solid #262a33;
      border-radius: 8px;
      color: #e6e6e6;
      padding: .65rem .8rem;
      font-family: inherit;
      font-size: .9rem;
      max-height: 160px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Test API — Chat</h1>
    <a href="/">&larr; dashboard</a>
    <div class="settings">
      <input id="provider" placeholder="Fournisseur" title="X-ProxyLLM-Provider — vide = default_provider" />
      <input id="model" value="gpt-4.1-nano" placeholder="Modèle" />
      <input id="apiKey" type="password" placeholder="Clé API (sk-...)" autocomplete="off" title="Clé du client, jamais lue depuis .env — partagée avec fourmi.html via ce navigateur" />
      <input id="virtualKey" type="password" placeholder="Clé virtuelle (Étape 6)" autocomplete="off" title="Envoyée en Authorization: Bearer — pour tester config/virtual_keys.yaml. Vide si aucune clé virtuelle configurée." />
      <button id="reset" class="secondary" type="button">Nouvelle conversation</button>
    </div>
  </header>
  <div id="warning">
    ⚠️ Page servie en HTTP (pas HTTPS) sur une IP publique : la clé transite en clair sur le réseau. À réserver aux clés de test / jetables.
  </div>

  <main>
    <div id="chat"><div class="empty">Écris un message ci-dessous pour tester l'API via le proxy.</div></div>
    <form id="composer">
      <textarea id="input" rows="2" placeholder="Écris un message…"></textarea>
      <button id="send" type="submit">Envoyer</button>
    </form>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const API_KEY_STORAGE = 'proxyllm_api_key';
    const VIRTUAL_KEY_STORAGE = 'proxyllm_virtual_key';
    const chatEl = $('chat');
    let messages = [];
    let chatStarted = false;

    try {
      const savedKey = localStorage.getItem(API_KEY_STORAGE);
      if (savedKey) $('apiKey').value = savedKey;
      const savedVk = localStorage.getItem(VIRTUAL_KEY_STORAGE);
      if (savedVk) $('virtualKey').value = savedVk;
    } catch (_) {}

    $('apiKey').addEventListener('change', (e) => {
      try {
        if (e.target.value) localStorage.setItem(API_KEY_STORAGE, e.target.value);
        else localStorage.removeItem(API_KEY_STORAGE);
      } catch (_) {}
    });
    $('virtualKey').addEventListener('change', (e) => {
      try {
        if (e.target.value) localStorage.setItem(VIRTUAL_KEY_STORAGE, e.target.value);
        else localStorage.removeItem(VIRTUAL_KEY_STORAGE);
      } catch (_) {}
    });

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function clearEmpty() {
      if (!chatStarted) {
        chatEl.innerHTML = '';
        chatStarted = true;
      }
    }

    function addBubble(role, text) {
      clearEmpty();
      const row = document.createElement('div');
      row.className = `bubble-row ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      row.appendChild(bubble);
      chatEl.appendChild(row);
      chatEl.scrollTop = chatEl.scrollHeight;
      return { row, bubble };
    }

    function setMeta(row, { status, latencyMs, usage, model, rawText }) {
      const meta = document.createElement('div');
      meta.className = 'meta-line';
      const ok = status >= 200 && status < 300;
      const parts = [`<span class="pill ${ok ? 'ok' : 'ko'}">HTTP ${status}</span>`];
      if (latencyMs != null) parts.push(`<span class="pill">${latencyMs} ms</span>`);
      if (model) parts.push(`<span class="pill">${escapeHtml(model)}</span>`);
      if (usage) {
        const { prompt_tokens: p, completion_tokens: c, total_tokens: t } = usage;
        if (t != null) parts.push(`<span class="pill">${t} tokens${p != null && c != null ? ` (${p}+${c})` : ''}</span>`);
      }
      if (rawText) parts.push('<a data-toggle-raw>voir la réponse brute</a>');
      meta.innerHTML = parts.join('');
      row.appendChild(meta);

      if (rawText) {
        const raw = document.createElement('div');
        raw.className = 'raw';
        raw.textContent = rawText;
        row.appendChild(raw);
        meta.querySelector('[data-toggle-raw]').addEventListener('click', () => {
          raw.style.display = raw.style.display === 'block' ? 'none' : 'block';
          chatEl.scrollTop = chatEl.scrollHeight;
        });
      }
    }

    $('reset').addEventListener('click', () => {
      messages = [];
      chatStarted = false;
      chatEl.innerHTML = '<div class="empty">Écris un message ci-dessous pour tester l\'API via le proxy.</div>';
    });

    $('composer').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = $('input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      const sendBtn = $('send');
      sendBtn.disabled = true;

      messages.push({ role: 'user', content: text });
      addBubble('user', text);
      const { row: aRow, bubble: aBubble } = addBubble('assistant', '…');
      aBubble.classList.add('loading');

      const payload = {
        provider: $('provider').value.trim(),
        method: 'POST',
        path: '/v1/chat/completions',
        body: JSON.stringify({
          model: $('model').value.trim() || 'gpt-4.1-nano',
          messages,
        }),
        api_key: $('apiKey').value.trim(),
        virtual_key: $('virtualKey').value.trim(),
      };

      try {
        const res = await fetch('/api/test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        let parsed = null;
        try { parsed = JSON.parse(data.body); } catch (_) {}

        const ok = data.status >= 200 && data.status < 300;
        const content = parsed?.choices?.[0]?.message?.content;

        aBubble.classList.remove('loading');
        if (ok && content) {
          aBubble.textContent = content;
          messages.push({ role: 'assistant', content });
          setMeta(aRow, {
            status: data.status,
            latencyMs: data.latency_ms,
            usage: parsed?.usage,
            model: parsed?.model,
            rawText: data.body,
          });
        } else {
          aBubble.classList.add('error');
          aBubble.textContent = ok
            ? "Réponse reçue mais sans contenu exploitable (pas de choices[0].message.content)."
            : (data.body || 'Erreur inconnue');
          setMeta(aRow, { status: data.status, latencyMs: data.latency_ms, rawText: data.body });
        }
      } catch (err) {
        aBubble.classList.remove('loading');
        aBubble.classList.add('error');
        aBubble.textContent = 'Erreur réseau : ' + err;
      } finally {
        sendBtn.disabled = false;
        input.focus();
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    });

    $('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        $('composer').requestSubmit();
      }
    });
  </script>
</body>
</html>
