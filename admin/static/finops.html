<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProxyLLM Glacis — FinOps</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0f1115;
      color: #e6e6e6;
    }
    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #262a33;
      display: flex;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 1.25rem; }
    header a { color: #7aa2f7; font-size: .85rem; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    .toolbar { margin-left: auto; }
    button {
      background: #3b6fe0;
      color: white;
      border: none;
      border-radius: 6px;
      padding: .45rem 1.1rem;
      font-size: .8rem;
      cursor: pointer;
    }
    button:hover { background: #4c7cf0; }

    main { max-width: 960px; margin: 0 auto; padding: 2rem; }
    .status-banner {
      padding: .8rem 1.1rem;
      border-radius: 8px;
      font-size: .85rem;
      margin-bottom: 1.5rem;
      border: 1px solid #262a33;
    }
    .status-banner.open { background: #1c2440; color: #9ab4ff; }
    .status-banner.closed { background: #1f3b2c; color: #7ee787; }

    .key-card {
      background: #171a21;
      border: 1px solid #262a33;
      border-radius: 8px;
      padding: 1.1rem 1.3rem;
      margin-bottom: 1rem;
    }
    .key-card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
    .key-card h2 { margin: 0; font-size: 1rem; }
    .key-card .masked { font-family: ui-monospace, monospace; color: #9aa2af; font-size: .8rem; }
    .badge {
      font-size: .68rem;
      padding: .15rem .55rem;
      border-radius: 999px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge.ok { background: #1f3b2c; color: #7ee787; }
    .badge.near { background: #3b2f1f; color: #fbbf7e; }
    .badge.exceeded { background: #3b1f1f; color: #ff7b72; }
    .badge.unlimited { background: #2a2f3a; color: #9aa2af; }

    .metrics { display: flex; gap: 2rem; margin-top: .8rem; flex-wrap: wrap; font-size: .82rem; }
    .metrics .metric .value { font-size: 1.1rem; font-weight: 600; }
    .metrics .metric .label { color: #9aa2af; font-size: .72rem; }

    .bar-track {
      margin-top: .8rem;
      height: 8px;
      border-radius: 999px;
      background: #0c0e12;
      overflow: hidden;
    }
    .bar-fill { height: 100%; border-radius: 999px; }
    .bar-fill.ok { background: #3b6fe0; }
    .bar-fill.near { background: #fbbf7e; }
    .bar-fill.exceeded { background: #ff7b72; }

    .empty { color: #9aa2af; font-size: .9rem; padding: 2rem; text-align: center; border: 1px dashed #262a33; border-radius: 8px; }

    .create-form {
      background: #171a21;
      border: 1px solid #262a33;
      border-radius: 8px;
      padding: 1.1rem 1.3rem;
      margin-bottom: 1.5rem;
      display: flex;
      gap: .8rem;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .create-form label { display: block; font-size: .72rem; color: #9aa2af; margin-bottom: .25rem; }
    .create-form input {
      background: #0c0e12;
      border: 1px solid #262a33;
      border-radius: 6px;
      color: #e6e6e6;
      padding: .45rem .6rem;
      font-size: .82rem;
    }
    #fName { width: 180px; }
    #fQuota { width: 130px; }
    #fCost { width: 110px; }

    .revoke-btn {
      background: transparent;
      border: 1px solid #3b1f1f;
      color: #ff7b72;
      padding: .3rem .7rem;
      font-size: .72rem;
    }
    .revoke-btn:hover { background: #3b1f1f; }

    .new-key-banner {
      background: #1f3b2c;
      border: 1px solid #2f5c40;
      border-radius: 8px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.5rem;
      display: none;
    }
    .new-key-banner .value {
      font-family: ui-monospace, monospace;
      font-size: .95rem;
      background: #0c0e12;
      padding: .5rem .7rem;
      border-radius: 6px;
      margin: .5rem 0;
      word-break: break-all;
      user-select: all;
    }
    .new-key-banner p { margin: .3rem 0; font-size: .8rem; }
    .new-key-banner .warn { color: #fbbf7e; }
  </style>
</head>
<body>
  <header>
    <h1>FinOps — Clés API virtuelles</h1>
    <a href="/">&larr; dashboard</a>
    <div class="toolbar">
      <button id="refresh">Actualiser</button>
    </div>
  </header>

  <main>
    <div id="newKeyBanner" class="new-key-banner">
      <p><strong>Clé créée</strong> — copie-la maintenant, elle ne sera plus jamais affichée en clair :</p>
      <div class="value" id="newKeyValue"></div>
      <p class="warn">⚠️ Page en HTTP simple sur une IP publique : transite en clair sur le réseau.</p>
    </div>

    <div class="create-form">
      <div>
        <label for="fName">Nom (équipe/projet)</label>
        <input id="fName" placeholder="ex: Équipe Support" />
      </div>
      <div>
        <label for="fQuota">Quota (tokens, optionnel)</label>
        <input id="fQuota" type="number" min="0" placeholder="illimité" />
      </div>
      <div>
        <label for="fCost">$ / 1k tokens (optionnel)</label>
        <input id="fCost" type="number" min="0" step="0.0001" placeholder="—" />
      </div>
      <button id="create">Créer une clé</button>
    </div>

    <div id="statusBanner" class="status-banner open">Chargement…</div>
    <div id="content"></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function keyCard(k) {
      let statusBadge = '<span class="badge unlimited">illimité</span>';
      let barClass = 'ok';
      if (k.quota_tokens != null) {
        if (k.quota_exceeded) { statusBadge = '<span class="badge exceeded">quota dépassé</span>'; barClass = 'exceeded'; }
        else if (k.near_quota) { statusBadge = '<span class="badge near">proche du quota</span>'; barClass = 'near'; }
        else { statusBadge = '<span class="badge ok">ok</span>'; }
      }

      const pct = k.percent_used != null ? Math.min(100, k.percent_used).toFixed(1) : null;
      const bar = k.quota_tokens != null
        ? `<div class="bar-track"><div class="bar-fill ${barClass}" style="width:${pct}%"></div></div>`
        : '';

      const cost = k.estimated_cost != null ? `$${k.estimated_cost.toFixed(4)}` : '—';
      const quota = k.quota_tokens != null ? k.quota_tokens.toLocaleString('fr-FR') : 'illimité';

      return `<div class="key-card">
        <div class="top">
          <h2>${escapeHtml(k.name)}</h2>
          <div style="display:flex;gap:.5rem;align-items:center;">
            ${statusBadge}
            <button class="revoke-btn" data-id="${escapeHtml(k.id)}" data-name="${escapeHtml(k.name)}">Révoquer</button>
          </div>
        </div>
        <div class="masked">${escapeHtml(k.key_masked)}</div>
        ${bar}
        <div class="metrics">
          <div class="metric"><div class="value">${k.tokens_used.toLocaleString('fr-FR')}</div><div class="label">Tokens consommés</div></div>
          <div class="metric"><div class="value">${quota}</div><div class="label">Quota</div></div>
          <div class="metric"><div class="value">${pct != null ? pct + '%' : '—'}</div><div class="label">Utilisé</div></div>
          <div class="metric"><div class="value">${k.requests.toLocaleString('fr-FR')}</div><div class="label">Requêtes</div></div>
          <div class="metric"><div class="value">${cost}</div><div class="label">Coût estimé (chargeback)</div></div>
        </div>
      </div>`;
    }

    async function load() {
      const banner = $('statusBanner');
      const content = $('content');
      banner.textContent = 'Chargement…';
      content.innerHTML = '';
      try {
        const res = await fetch('/api/chargeback');
        const data = await res.json();

        if (data.has_keys) {
          banner.className = 'status-banner closed';
          banner.textContent = 'ℹ️ Suivi par équipe actif : les appels avec une clé (Authorization: Bearer <clé>) sont rattachés à leur équipe ci-dessous. Les appels sans clé passent normalement, comptabilisés à part sous « Équipe inconnue » (jamais bloqués).';
        } else {
          banner.className = 'status-banner open';
          banner.textContent = 'ℹ️ Aucune clé virtuelle configurée — crée-en une ci-dessous pour commencer à suivre la consommation par équipe. Les clés sont toujours facultatives : le proxy ne bloque jamais un appel pour absence de clé.';
        }

        if (!data.keys || data.keys.length === 0) {
          content.innerHTML = '<div class="empty">Aucune clé virtuelle configurée.</div>';
          return;
        }
        content.innerHTML = data.keys.map(keyCard).join('');

        content.querySelectorAll('.revoke-btn').forEach((btn) => {
          btn.addEventListener('click', async () => {
            if (!confirm(`Révoquer la clé « ${btn.dataset.name} » ? Cette action est irréversible.`)) return;
            btn.disabled = true;
            btn.textContent = '…';
            try {
              const res = await fetch(`/api/virtual-keys/${encodeURIComponent(btn.dataset.id)}`, { method: 'DELETE' });
              if (!res.ok) throw new Error(await res.text());
              await load();
            } catch (e) {
              alert('Échec de la révocation : ' + e);
              btn.disabled = false;
              btn.textContent = 'Révoquer';
            }
          });
        });
      } catch (e) {
        banner.className = 'status-banner closed';
        banner.textContent = 'Erreur réseau : ' + e;
      }
    }

    $('create').addEventListener('click', async () => {
      const name = $('fName').value.trim();
      if (!name) { alert('Le nom est requis.'); return; }

      const quotaRaw = $('fQuota').value.trim();
      const costRaw = $('fCost').value.trim();
      const payload = {
        name,
        quota_tokens: quotaRaw ? parseInt(quotaRaw, 10) : null,
        cost_per_1k_tokens: costRaw ? parseFloat(costRaw) : null,
      };

      const btn = $('create');
      btn.disabled = true;
      btn.textContent = 'Création…';
      try {
        const res = await fetch('/api/virtual-keys', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error(await res.text());
        const created = await res.json();

        $('newKeyValue').textContent = created.key;
        $('newKeyBanner').style.display = 'block';
        $('fName').value = '';
        $('fQuota').value = '';
        $('fCost').value = '';
        await load();
      } catch (e) {
        alert('Échec de la création : ' + e);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Créer une clé';
      }
    });

    $('refresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
